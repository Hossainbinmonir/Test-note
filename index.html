<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DeepNote</title>
<style>
:root{--bg-primary:#000;--bg-secondary:#1c1e21;--bg-tertiary:#242526;--bg-hover:#3a3b3c;--text-primary:#fff;--text-secondary:#b0b3b8;--text-muted:#65676b;--accent:#0084ff;--accent-light:#00c6ff;--danger:#fa3e3e;--success:#31a24c;--border:#1c1e21;--bubble-left:#242526;--bubble-right:#0084ff;--shadow:rgba(0,0,0,.5)}
.light-mode{--bg-primary:#fff;--bg-secondary:#f0f2f5;--bg-tertiary:#e4e6eb;--bg-hover:#d8dadf;--text-primary:#050505;--text-secondary:#65676b;--text-muted:#8a8d91;--border:#e4e6eb;--bubble-left:#e4e6eb;--shadow:rgba(0,0,0,.2)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0a0a0a;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:420px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg-primary);color:var(--text-primary);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-primary)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;display:block}
input,textarea{font:inherit;color:var(--text-primary);user-select:text;-webkit-user-select:text;outline:0}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes messageIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes highlightPulse{0%,100%{box-shadow:0 0 0 0 transparent}25%,75%{box-shadow:0 0 0 6px rgba(0,132,255,.55)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,132,255,.6)}70%{box-shadow:0 0 0 16px rgba(0,132,255,0)}100%{box-shadow:0 0 0 0 rgba(0,132,255,0)}}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-15deg)}40%,80%{transform:rotate(15deg)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;animation:slideDown .4s}
.top h1{font-size:28px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .btns{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-tertiary);display:grid;place-items:center;transition:.15s;flex:none;position:relative}
.icon-btn:hover{background:var(--bg-hover);filter:brightness(1.1)}.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.bell-on svg{animation:bellRing 1.4s infinite}
.badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--bg-primary)}
.badge-cnt{position:absolute;top:0;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg-primary);line-height:1}
.search{position:relative;padding:8px 16px}
.search input{width:100%;padding:10px 16px 10px 44px;border-radius:20px;border:0;background:var(--bg-tertiary);font-size:15px}
.search input::placeholder{color:var(--text-muted)}
.search-ic{position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;display:flex}
.search-ic svg{width:18px;height:18px}
#results{display:none;position:absolute;left:16px;right:16px;top:100%;max-height:50vh;overflow-y:auto;background:var(--bg-secondary);border-radius:14px;box-shadow:0 8px 24px var(--shadow);z-index:20}
#results.show,#settings.show,#side-pop.show,#ctx.show{display:block;animation:fadeIn .15s}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;transition:.15s}
.res:hover{background:var(--bg-hover)}
.res .rt{flex:1;min-width:0}.res b,.res small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res small{color:var(--text-secondary);font-size:12px}
.res>span:first-child{display:flex;align-items:center;color:var(--text-secondary)}
.res>span:first-child svg{width:18px;height:18px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg-tertiary);color:var(--accent)}
.cat-list,.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cat-list::-webkit-scrollbar,.chat-body::-webkit-scrollbar{width:4px}
.cat-list::-webkit-scrollbar-thumb,.chat-body::-webkit-scrollbar-thumb{background:var(--bg-hover);border-radius:4px}
.empty{padding:40px 24px;text-align:center;color:var(--text-muted);font-size:14px}.empty.sm{padding:14px}
.empty-ic{display:flex;justify-content:center;margin-bottom:12px;color:var(--text-muted)}
.empty-ic svg{width:44px;height:44px}
.row{position:relative;overflow:hidden}
.acts{position:absolute;right:0;top:0;bottom:0;width:120px;display:flex}
.act{flex:1;display:grid;place-items:center;color:#fff}.act.edit{background:var(--accent)}.act.del{background:var(--danger)}
.act:active{filter:brightness(.85)}
.row-c{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg-primary);transition:transform .2s;will-change:transform;touch-action:pan-y;cursor:pointer}
.row-c:hover{background:var(--bg-secondary)}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.avatar.sm{width:32px;height:32px;font-size:15px}
.avatar img{width:100%;height:100%;object-fit:cover}
.row-t{min-width:0;flex:1}.row-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-p{font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pin-ic{display:inline-flex;align-items:center;vertical-align:-2px;margin-right:4px;color:var(--accent)}
.pin-ic svg{width:14px;height:14px}
.fab{position:absolute;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:grid;place-items:center;color:#fff;animation:pulse 2s infinite;transition:transform .3s;will-change:transform;z-index:5}
.fab:hover{transform:rotate(90deg) scale(1.1)}.fab:active{transform:rotate(90deg) scale(.95)}
.fab svg{width:26px;height:26px}
#chat-screen{transform:translateX(100%);transition:transform .3s ease;will-change:transform;z-index:10}
#chat-screen.open{transform:translateX(0)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-primary);animation:slideDown .3s}
.chat-head b{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back-btn svg{transition:transform .2s}#back-btn:hover svg{transform:translateX(-3px)}
#settings-btn svg{transition:transform .2s}#settings-btn:hover svg{transform:rotate(90deg)}
#settings{display:none;position:absolute;top:56px;right:10px;background:var(--bg-secondary);border-radius:12px;box-shadow:0 8px 24px var(--shadow);z-index:30;overflow:hidden;min-width:230px}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;text-align:left;font-size:14px;transition:.15s}
.opt:hover{background:var(--bg-hover)}.opt.on{color:var(--accent);font-weight:700}.opt span{margin-left:auto}
.opt svg{width:16px;height:16px;flex:none}
.opt>span:last-child{display:flex;align-items:center}
.chat-body{padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;align-items:flex-end;gap:6px;will-change:transform;border-radius:18px}
.msg.right{justify-content:flex-end}.msg.new{animation:messageIn .3s}.msg.hl{animation:highlightPulse 2s}
.bubble{max-width:70%;padding:8px 12px;border-radius:18px;background:var(--bubble-left);font-size:15px;line-height:1.4}
.msg.left .bubble{border-bottom-left-radius:4px}
.msg.right .bubble{background:var(--bubble-right);color:#fff;border-bottom-right-radius:4px}
.txt{white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.bubble img{display:block;max-width:100%;max-height:300px;border-radius:8px;margin-bottom:4px;cursor:zoom-in}
.quote{font-size:12px;opacity:.8;border-left:3px solid var(--accent-light);background:rgba(128,128,128,.2);padding:3px 8px;border-radius:6px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text-muted);flex:none;transition:.15s}
.more:hover{background:var(--bg-hover);color:var(--text-primary)}.more svg{width:16px;height:16px}
.bar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-secondary);border-left:3px solid var(--accent);font-size:13px;color:var(--text-secondary)}
.bar.show{display:flex}.bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar img{height:36px;border-radius:6px}
.bar button{width:24px;height:24px}.bar svg{width:16px;height:16px}
.foot{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-top:1px solid var(--border);background:var(--bg-primary)}
.foot textarea{flex:1;resize:none;max-height:110px;padding:9px 14px;border-radius:20px;border:0;background:var(--bg-tertiary);font-size:15px}
.send{color:var(--accent)}
#side-pop{display:none;position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--bg-secondary);border-radius:24px;box-shadow:0 6px 20px var(--shadow);padding:4px;z-index:30;white-space:nowrap}
#side-pop.show{display:flex}
#side-pop button{padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
#side-pop button:hover{background:var(--accent);color:#fff}
#side-pop svg{width:14px;height:14px}
#ctx{display:none;position:fixed;background:var(--bg-secondary);border-radius:12px;box-shadow:0 8px 24px var(--shadow);z-index:60;overflow:hidden;min-width:140px}
#ctx .opt.danger{color:var(--danger)}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fadeIn .2s}
.modal{width:100%;max-height:90vh;overflow-y:auto;background:var(--bg-secondary);border-radius:16px;padding:20px;animation:slideUp .25s}
.modal h3{margin-bottom:12px}.modal p{color:var(--text-secondary);margin-bottom:12px;font-size:14px}.modal p b{color:var(--text-primary)}
.minput{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bg-hover);background:var(--bg-tertiary);font-size:15px;min-height:44px}
textarea.minput{min-height:100px;resize:vertical}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:10px;background:var(--bg-tertiary);font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:15px;height:15px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:#fff}.btn.danger{background:var(--danger)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);max-width:90%;padding:10px 18px;border-radius:20px;background:var(--bg-hover);color:var(--text-primary);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;box-shadow:0 4px 14px var(--shadow);display:inline-flex;align-items:center;gap:8px}
#toast.show{opacity:1}
#viewer{display:none;position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:70;align-items:center;justify-content:center;animation:fadeIn .2s}
#viewer.show{display:flex}#viewer img{max-width:100%;max-height:100%}
#viewer button{position:absolute;top:14px;right:14px;color:#fff;background:rgba(255,255,255,.15);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.time{font-size:10px;opacity:.65;text-align:right;margin-top:2px;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;width:100%}
.time svg{width:11px;height:11px}
.dsep{align-self:center;font-size:12px;color:var(--text-muted);background:var(--bg-secondary);padding:3px 12px;border-radius:12px;margin:6px 0}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.emo button{width:36px;height:36px;border-radius:50%;background:var(--bg-tertiary);font-size:18px;transition:.15s}
.emo button:hover{background:var(--bg-hover)}.emo button.on{outline:2px solid var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-light);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px}
.bubble{-webkit-touch-callout:none}
body{-webkit-font-smoothing:antialiased}

.top .btns{gap:2px}

.row-n{font-size:16px;font-weight:600}.row-p{font-size:13.5px;margin-top:3px}

#sel-bar.show{display:flex}#sel-bar b{flex:1;font-size:15px;padding-left:6px}
.selb{width:40px;height:40px;border-radius:50%;font-size:18px;display:grid;place-items:center;color:var(--text-secondary)}.selb:hover{background:var(--bg-secondary);color:var(--text-primary)}
.msg.sel{background:rgba(var(--acc-rgb,0,132,255),.14)}.selmode .more{display:none}.selmode .msg{cursor:pointer}
.sfilt{display:none}.sfilt.show{display:flex;gap:6px;padding-top:8px;overflow-x:auto}
#ctx,#settings,#results,#side-pop,.modal,.opt,.res,.mrow{color:var(--text-primary)}
.opt.danger{color:var(--danger)}.opt.on{color:var(--accent)}
.chat-head,.chat-head b{color:var(--chat-ink,var(--text-primary))}
.chat-head .icon-btn,.foot .icon-btn:not(.send){color:var(--chat-ink,var(--text-secondary))}

.grip{display:flex;align-items:center;color:var(--text-muted);padding:6px 2px 6px 8px;touch-action:none;cursor:grab;flex:none;user-select:none}
.grip svg{width:18px;height:18px}
.row.drag{background:var(--bg-secondary);box-shadow:0 6px 18px var(--shadow);position:relative;z-index:3}
#print{display:none}
@media print{
  body{background:#fff}#app,#ctx{display:none!important}

/* ===== REMINDERS SCREEN — clean, guaranteed to show ===== */
#rem-screen{
  position:absolute;top:0;right:0;bottom:0;left:0;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
  z-index:40;
  background:var(--bg-primary);
  display:flex;flex-direction:column;
  will-change:transform;
  visibility:visible;
}
#rem-screen.open{transform:translateX(0)}
#rem-screen .chat-head{flex:none;background:var(--bg-primary)}
#rem-screen .chat-body{flex:1;overflow-y:auto;padding:0;display:block}

.rem-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bg-secondary);background:var(--bg-primary);cursor:pointer;transition:.15s}
.rem-row:hover{background:var(--bg-secondary)}
.rem-row.due{background:rgba(250,62,62,.08)}
.rem-row.due .rem-time{color:var(--danger)}
.rem-row.fired{opacity:.55}
.rem-ic{width:42px;height:42px;border-radius:12px;background:var(--bg-tertiary);display:grid;place-items:center;color:var(--accent);flex:none}
.rem-row.due .rem-ic{background:rgba(250,62,62,.15);color:var(--danger)}
.rem-ic svg{width:20px;height:20px}
.rem-info{flex:1;min-width:0}
.rem-head{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-sub{font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.rem-time{font-size:12px;color:var(--text-muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px}
.rem-time svg{width:12px;height:12px}

#ring{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
#ring.show{display:flex}
.ring-card{width:100%;max-width:380px;background:var(--bg-secondary);border-radius:24px;padding:28px 24px;text-align:center;animation:slideUp .3s;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.ring-card .when{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.ring-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ring-actions .btn{min-width:100px;justify-content:center}
.snooze{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.snooze button{padding:7px 14px;border-radius:20px;background:var(--bg-tertiary);font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px}

    cs.clear();cats.forEach(c=>cs.put(c));add.forEach(([k,v])=>is.put(v,k));imgKnown.forEach(k=>{if(!live.has(k))is.delete(k)});
    tx.oncomplete=()=>{add.forEach(([k])=>imgKnown.add(k));[...imgKnown].forEach(k=>{if(!live.has(k))imgKnown.delete(k)});

}

/* ============================================================
   ===== NOTIFICATIONS — Service Worker + fallback =====
   ============================================================ */
let swReg=null;
async function initServiceWorker(){
  if(!('serviceWorker' in navigator))return false;
  try{
    /* Build SW from a Blob so we don't need a separate file */
    const swCode=`
      self.addEventListener('install',e=>self.skipWaiting());
      self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
      self.addEventListener('notificationclick',e=>{
        e.notification.close();
        e.waitUntil(self.clients.matchAll({type:'window',includeUncontrolled:true}).then(cs=>{
          for(const c of cs){if('focus' in c)return c.focus()}
          if(self.clients.openWindow)return self.clients.openWindow('/');
        }));
      });
      self.addEventListener('message',e=>{
        const d=e.data||{};
        if(d.type==='notify'){
          self.registration.showNotification(d.title,{
            body:d.body||'',tag:d.tag||'deepnote',icon:d.icon||undefined,
            badge:d.badge||undefined,requireInteraction:!!d.requireInteraction,
            vibrate:[200,100,200,100,200],silent:!!d.silent,data:d.data||{}
          });
        }
      });
    `;
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    swReg=await navigator.serviceWorker.register(url,{scope:'./'});
    return true;
  }catch(e){console.warn('SW init failed:',e);return false}
}
async function askNotifPerm(){
  if(!('Notification' in window)){return false}
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  try{const p=await Notification.requestPermission();return p==='granted'}catch(e){return false}
}
/* Show notification — tries SW first (mobile), falls back to direct (desktop) */
async function showSystemNotif(title,body,tag,data){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const opts={body:body||'',tag:tag||('deepnote-'+Date.now()),requireInteraction:false,silent:false,vibrate:[200,100,200,100,200],data:data||{}};
  /* Try service worker first — required for Android Chrome */
  try{
    if(swReg&&swReg.active){
      swReg.active.postMessage({type:'notify',title,body:opts.body,tag:opts.tag,requireInteraction:opts.requireInteraction,silent:opts.silent,data:opts.data});
      return true;
    }
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      const reg=await navigator.serviceWorker.ready;
      if(reg&&reg.showNotification){await reg.showNotification(title,opts);return true}
    }
  }catch(e){console.warn('SW notify failed:',e)}
  /* Fallback: direct Notification (desktop only) */
  try{const n=new Notification(title,opts);n.onclick=()=>{window.focus();n.close()};return true}
  catch(e){console.warn('Notification failed:',e);return false}
}

function getAudio(){if(audioCtx)return audioCtx;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}return audioCtx}
function tone(freq,dur,type,gain,delay){
  const ac=getAudio();if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=freq;g.gain.value=0;
  const t0=ac.currentTime+(delay||0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain||0.25,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.05);
}

function formatWhen(when){
  const d=new Date(when),diff=when-Date.now();
  const pad=n=>String(n).padStart(2,'0');
  const time=pad(d.getHours())+':'+pad(d.getMinutes());
  const today=new Date();today.setHours(0,0,0,0);
  const day=new Date(when);day.setHours(0,0,0,0);
  const dayDiff=Math.round((day-today)/864e5);
  let dayStr;
  if(dayDiff===0)dayStr='আজ';
  else if(dayDiff===1)dayStr='আগামীকাল';
  else if(dayDiff===-1)dayStr='গতকাল';
  else if(dayDiff>1&&dayDiff<7)dayStr=dayDiff+' দিন পর';
  else dayStr=d.toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
  if(diff<0)return dayStr+' '+time+' (শেষ)';
  if(diff<3600000)return Math.ceil(diff/60000)+' মিনিট পর';
  return dayStr+' '+time;
}
let nextTimer=null;

  const now=Date.now();
  let dirty=false;

  if(dirty)saveRems();
  const pending=S.rems.filter(r=>!r.done&&!r.fired).sort((a,b)=>a.when-b.when);
  updateBellBadge();
  if(S.remOpen)renderRems();
  if(!pending.length)return;
  const next=pending[0];
  const delay=Math.max(500,next.when-Date.now());
  nextTimer=setTimeout(()=>{fireDue();scheduleAll()},Math.min(delay,2147000000));
}

    if(r.done)section='সম্পন্ন';
    else if(r.fired)section='মিস হয়েছে';
    else if(dd<0)section='আগের';
    else if(dd===0)section='আজ';
    else if(dd===1)section='আগামীকাল';
    else if(dd<7)section='এই সপ্তাহে';
    else section='পরে';
    if(section!==lastSection){L.append(h('div','msec',null,section));lastSection=section}
    L.append(remRow(r));
  });
  L.scrollTop=scroll;
}

function swipe(el,c){
  let x0=0,base=0,drag=false,moved=false;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;base=el._x||0;drag=true;moved=false;el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;if(moved)setX(el,Math.max(-120,Math.min(0,base+dx)))});
  const end=()=>{if(!drag)return;drag=false;el.style.transition='';if(!moved)return;
    if((el._x||0)<=-60){if(S.openRow&&S.openRow!==el)setX(S.openRow,0);setX(el,-120);S.openRow=el}else setX(el,0)};
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,end));

function squareImg(f,cb){
  if(!f)return;if(!f.type.startsWith('image/')){showToast('শুধু ছবি সিলেক্ট করুন');return}
  if(f.size>10*1024*1024){showToast('ছবি ১০MB এর বেশি হতে পারবে না');return}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=160;
    cv.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);cb(cv.toDataURL('image/jpeg',0.8))};
    im.onerror=()=>showToast('ছবি লোড করা যায়নি');im.src=r.result};r.readAsDataURL(f);
}

  $('#sel-move').innerHTML=ic('move');
  $('#sel-del').innerHTML=ic('trash');
  $('#pop-l').innerHTML=ic('arrowL')+' বাম পাশে';
  $('#pop-r').innerHTML='ডান পাশে '+ic('arrowR');
  $('#ring-close').onclick=closeRing;
  $('#sel-copy').onclick=()=>{copyText(selNotes().map(n=>n.text).filter(Boolean).join('\n\n'));exitSel()};
  $('#sel-star').onclick=()=>{const ns=selNotes(),all=ns.every(n=>n.star);ns.forEach(n=>n.star=!all);save();exitSel();renderChat()};
  $('#sel-move').onclick=selMove;$('#sel-del').onclick=selDelete;
  $('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';importData(f)};
  $('#edit-title').onclick=editTitle;$('#fab').onclick=newCat;$('#back-btn').onclick=goBack;
  $('#theme-btn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';safeSave(K.THEME,S.theme);applyTheme()};
  let sd;$('#search').addEventListener('input',()=>{clearTimeout(sd);sd=setTimeout(doSearch,250)});
  S.sf={img:0,star:0,d:0};$('#search').addEventListener('focus',()=>$('#sfilt').classList.add('show'));
  const SF=[['img','image','ছবি'],['star','star','স্টার'],['d1','clock','আজ'],['d7','clock','৭ দিন']];
  SF.forEach(([k,icon,l])=>{const b=h('button','chip');b.innerHTML=ic(icon)+' '+l;b.onclick=()=>{
    if(k[0]==='d'){const v=+k.slice(1);S.sf.d=S.sf.d===v?0:v}else S.sf[k]=S.sf[k]?0:1;
    $('#sfilt').querySelectorAll('button').forEach((x,i)=>{const kk=SF[i][0];x.classList.toggle('on',kk[0]==='d'?S.sf.d===+kk.slice(1):!!S.sf[kk])});doSearch()};$('#sfilt').append(b)});
  $('#settings-btn').onclick=e=>{e.stopPropagation();const o=$('#settings').classList.contains('show');closePops();if(!o)$('#settings').classList.add('show')};
  $('#send').onclick=send;$('#clip').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';handleFile(f)};
  $('#reply-x').onclick=()=>{S.reply=null;updBars()};$('#attach-x').onclick=()=>{S.img=null;updBars()};
  $('#pop-l').onclick=e=>{e.stopPropagation();hidePop();addNote('left')};$('#pop-r').onclick=e=>{e.stopPropagation();hidePop();addNote('right')};
  const ni=$('#note-input');
  ni.addEventListener('input',()=>{updBars();ni.style.height='auto';ni.style.height=Math.min(ni.scrollHeight,110)+'px'});
  ni.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  $('#viewer').onclick=e=>{if(e.target.tagName!=='IMG')$('#viewer').classList.remove('show')};
  document.addEventListener('click',e=>{if(!e.target.closest('#results,#settings,#side-pop,#ctx,.more,#settings-btn,#search,#sfilt'))closePops();
    if(!e.target.closest('.search')&&!$('#search').value&&!(S.sf.img||S.sf.star||S.sf.d))$('#sfilt').classList.remove('show')});
  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
    if($('#ring').classList.contains('show'))closeRing();
    else if(document.querySelector('.backdrop'))closeModal();
    else if($('#viewer').classList.contains('show'))$('#viewer').classList.remove('show');
    else if(document.querySelector('#results.show,#settings.show,#side-pop.show,#ctx.show'))closePops();
    else if(S.sel)exitSel();
    else if(S.remOpen)closeRems();
    else if($('#chat-screen').classList.contains('open'))goBack()});
  window.addEventListener('popstate',()=>{
    if(S.remOpen)closeRems();
    else if($('#chat-screen').classList.contains('open'))showHome();
  });
  S.remTick=setInterval(()=>{fireDue();updateBellBadge();if(S.remOpen)renderRems()},30000);
  const resumeAudio=()=>{const a=getAudio();if(a&&a.state==='suspended')a.resume();document.removeEventListener('pointerdown',resumeAudio);document.removeEventListener('keydown',resumeAudio)};
  document.addEventListener('pointerdown',resumeAudio);
  document.addEventListener('keydown',resumeAudio);
}
async function initializeApp(){
  await initServiceWorker();
  await dbInit();
  loadData();applyTheme();applyLook();
  $('#title').textContent=S.title;
  renderCategories();updateSendModeUI();setupEventListeners();
  updateBellBadge();
  scheduleAll();
  if(safeLoad(K.CURRENT_SCREEN,'home')==='chat'&&cat(safeLoad(K.ACTIVE_CAT,null)))openChat(safeLoad(K.ACTIVE_CAT,null));
  if(!S.cats.length)showToast('স্বাগতম! + চেপে প্রথম ক্যাটাগরি বানান',3000);else backupNudge();
  if(S.pin)showLock();
  if(!S.rems.length&&!safeLoad('deepnote_rem_hint',false)){
    safeSave('deepnote_rem_hint',true);
    setTimeout(()=>showToast('বেল আইকনে ট্যাপ করে রিমাইন্ডার সেট করুন',5000),2500);
  }
}
initializeApp();
</script>
</body>
</html>
